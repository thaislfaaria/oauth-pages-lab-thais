
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Montar o prompt
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          {
            echo "Revise este código em português."
            echo "Procure segredos expostos, SQL sem prepare().bind() e erros de lógica."
            echo "Liste até 10 problemas e explique como corrigi-los."
            echo '```diff'
            git diff "origin/${BASE_BRANCH}...HEAD" | head -c 20000
            echo '```'
          } > prompt.txt

      - name: Revisar com IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.

      - name: Comentar no pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file "${{ steps.ia.outputs.response-file }}"
