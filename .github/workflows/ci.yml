
name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Procura segredos versionados
        run: |
          if git grep -nE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!.github/workflows/ci.yml' ':!*.md'; then
            echo "::error::Possível segredo no repositório"
            exit 1
          fi

      - name: Aplica as migrações D1 em um SQLite local
        run: |
          shopt -s nullglob
          arquivos=(migrations/*.sql)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "::error::Nenhuma migração SQL encontrada em migrations/"
            exit 1
          fi
          for f in "${arquivos[@]}"; do
            sqlite3 teste.db < "$f" || exit 1
          done
          sqlite3 teste.db ".tables"

      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
      - name: Teste de falha proposital
        run: exit 1
